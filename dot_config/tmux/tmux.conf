# ~/.tmux.conf
set -g history-limit 100000

# Use 256-color mode.
set -g default-terminal "screen-256color"

# Enable mouse support (resize panes, switch windows/panes by clicking, etc.).
set -g mouse on

# Use vim style copy/paste in copy mode.
setw -g mode-keys vi

# Pane splitting shortcuts that keep the same working directory:
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# Reload configuration.
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ------------------------------
# 2. Status Bar Customization
# ------------------------------
# Basic styling
set -g status-bg colour236
set -g status-fg colour249
setw -g window-status-current-format "#[bold,fg=colour223,bg=colour31] #I:#W "

set -g status-left "#[fg=colour34,bg=colour236] #S "
set -g status-right "#[fg=colour249,bg=colour236] %Y-%m-%d %H:%M "

# ------------------------------
# 3. Plugins (via TPM)
# ------------------------------
# Ensure TPM is sourced as early as possible.
run-shell "~/.tmux/plugins/tpm/tpm"

# List of plugins:
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

# 1) tmux-sensible provides a great set of defaults.
# 2) tmux-resurrect + tmux-continuum let you save/restore sessions automatically.
# 3) tmux-yank allows system clipboard integration for copying from tmux.
# 4) tmux-prefix-highlight shows you when you’ve pressed your prefix.
# 5) vim-tmux-navigator lets you move seamlessly between tmux panes and Vim splits.

# Initialize TMUX plugin manager (keep this line at the very bottom of plugin section)
run '~/.tmux/plugins/tpm/tpm'

set -g @catppuccin_flavour 'frappe'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
